# V3 CI (dev plan §2.4, code design §10).  Triggers only on V3 paths so
# V1/V2 commits are unaffected.  Secrets: none — the integration job uses a
# throwaway Postgres with a dummy password.
name: v3

on:
  pull_request:
    # labeled / unlabeled: the golden gate reads the eval-exempt /
    # baseline-reset labels (PROD-10).
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "stf_v3/**"
      - "infra/docker-compose.v3*"
      - "infra/docker-compose.vllm.yml"
      - "infra/vllm_ctl.sh"
      - "docs/v3_ops_runbook.md"
      - "docs/v3_dev_plan.md"
      - "docs/evals/**"
      - "docs/api/**"
      - ".github/workflows/v3.yml"
      - "obd_agent/jetson_uploader.py"
      - "obd_agent/tests/test_jetson_uploader*.py"
      - "obd_agent/tests/test_device_install_doc.py"
      - "docs/v3_device_install.md"
  push:
    branches: [main]
    paths:
      - "stf_v3/**"
      - "infra/docker-compose.v3*"
      - "infra/docker-compose.vllm.yml"
      - "infra/vllm_ctl.sh"
      - "docs/v3_ops_runbook.md"
      - "docs/v3_dev_plan.md"
      - "docs/evals/**"
      - "docs/api/**"
      - ".github/workflows/v3.yml"
      - "obd_agent/jetson_uploader.py"
      - "obd_agent/tests/test_jetson_uploader*.py"
      - "obd_agent/tests/test_device_install_doc.py"
      - "docs/v3_device_install.md"
  schedule:
    - cron: "0 19 * * *"   # nightly 03:00 HKT: unbound check
  workflow_dispatch:

jobs:
  unit-contract:
    name: unit + contract (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "stf_v3[dev]"
      - name: pre-fetch the eval tokenizer (cl100k_base; the golden scorer counts tokens)
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: offline pytest (DB tests skip)
        run: pytest -q -p no:cacheprovider stf_v3/tests
      - name: import-linter contracts (no V1/V2 imports; layer direction)
        working-directory: stf_v3
        run: lint-imports
      - name: OpenAPI contract up to date
        run: python stf_v3/scripts/export_openapi.py --check

  integration:
    name: integration (throwaway Postgres 15)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stf_v3
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: stf_v3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stf_v3" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      STF_V3_TEST_DATABASE_URL: postgresql+psycopg://stf_v3:ci@localhost:5432/stf_v3_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "stf_v3[dev]"
      - name: pre-fetch the eval tokenizer (cl100k_base; the golden scorer counts tokens)
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: create runtime role (migration grants to it)
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          PGPASSWORD=ci psql -h localhost -U stf_v3 -d stf_v3_test \
            -c "CREATE ROLE stf_v3_app LOGIN PASSWORD 'ci'"
      - name: migration round-trip + API tests
        working-directory: stf_v3
        run: pytest -q -p no:cacheprovider
      - name: schema acceptance checks
        working-directory: stf_v3
        run: |
          STF_V3_DATABASE_URL="$STF_V3_TEST_DATABASE_URL" alembic upgrade head
          python scripts/check_schema.py --url "$STF_V3_TEST_DATABASE_URL" \
            --app-url postgresql+psycopg://stf_v3_app:ci@localhost:5432/stf_v3_test

  uploader:
    # PROD-07: the device-side script (V2 + V3 dual push).  Runs on the
    # oldest interpreter the script must support AND the dev version, with
    # only the dependency the device already has (httpx).
    name: jetson uploader (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install "httpx==0.26.0" "pytest==7.4.4"
      - name: uploader tests (offline) + install-guide contract
        run: |
          # --noconftest: obd_agent/tests/conftest.py imports the analysis
          # library (pydantic); the uploader tests need neither.
          python -m pytest -q -p no:cacheprovider --noconftest \
            obd_agent/tests/test_jetson_uploader.py \
            obd_agent/tests/test_jetson_uploader_v3.py \
            obd_agent/tests/test_device_install_doc.py

  portable:
    name: portable (D3 ①)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "tiktoken==0.14.0"
      - name: pre-fetch the eval tokenizer (cl100k_base; the golden scorer counts tokens)
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - run: bash stf_v3/scripts/check_portable.sh

  eval-gate:
    # PROD-10 D2: a PR that touches the agent's brain (managed paths in
    # stf_v3/evals/thresholds.yaml) must add a fresh, passing golden
    # scorecard under docs/evals/.  The eval itself needs the server GPU
    # (stf_v3/scripts/run_golden_eval.sh); CI only checks the evidence.
    name: golden eval gate (PROD-10)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                                   # freshness walks commits
          ref: ${{ github.event.pull_request.head.sha }}   # the PR head, not the merge commit
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "pyyaml==6.0.2"
      - name: check the golden scorecard evidence
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python stf_v3/scripts/check_eval_gate.py --base "origin/$BASE_REF" --head HEAD --labels "$LABELS"

  unbound:
    name: unbound (D3 ②, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: bash stf_v3/scripts/check_unbound.sh
