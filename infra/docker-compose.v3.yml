# STF V3 services — independent Compose file (dev plan D3, constraint B).
# Shares ONLY infrastructure with V1/V2 (Postgres instance, vLLM =
# docker-compose.vllm.yml, nginx),
# all via configuration.  Never merge this into docker-compose.yml.
#
# Build (GIT_COMMIT is baked into the image label for deploy_check.sh):
#   GIT_COMMIT=$(git rev-parse HEAD) podman-compose -p stf_v3 \
#     -f docker-compose.v3.yml -f docker-compose.v3.polyu.yml build
# Migrate (owner role; the service sits in the `migrate` profile, so
# --profile migrate is required -- without it podman-compose 1.5 only
# warns "missing services" and exits 0):
#   podman-compose --profile migrate -p stf_v3 \
#     -f docker-compose.v3.yml -f docker-compose.v3.polyu.yml \
#     run --rm stf-v3-migrate alembic upgrade head
# Run (runtime role):
#   podman-compose -p stf_v3 -f docker-compose.v3.yml -f docker-compose.v3.polyu.yml \
#     up -d stf-v3-api stf-v3-worker
# Always pass -p stf_v3: without it V3 lands in the V1/V2 pod.
#
# Variables come from infra/.env on the server (never committed):
#   STF_V3_DATABASE_URL, STF_V3_APP_DATABASE_URL, STF_V3_JWT_SECRET

services:
  stf-v3-api:
    build:
      context: ../stf_v3
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: stf-v3:local
    container_name: stf-v3-api
    environment:
      STF_V3_DATABASE_URL: ${STF_V3_APP_DATABASE_URL:?set STF_V3_APP_DATABASE_URL}
      STF_V3_JWT_SECRET: ${STF_V3_JWT_SECRET:?set STF_V3_JWT_SECRET}
      STF_V3_ENVIRONMENT: ${STF_V3_ENVIRONMENT:-prod}
      STF_V3_LOG_LEVEL: ${STF_V3_LOG_LEVEL:-INFO}
      STF_V3_OBD_LOG_STORAGE_PATH: /app/data/obd_logs
      STF_V3_MANUAL_STORAGE_PATH: /app/data/manuals
      # Agent runtime (PROD-08): the single model source.  Defaults to the
      # host's vLLM (docker-compose.vllm.yml, PROD-09); to fall back to
      # Ollama set URL/MODEL/API_KEY in infra/.env (profile auto-selects).
      # A non-local URL needs STF_V3_LLM_ALLOW_CLOUD=true (prompts then
      # carry a VIN pseudonym) and deploy_check.sh check 9 fails on it.
      STF_V3_LLM_BASE_URL: ${STF_V3_LLM_BASE_URL:-http://127.0.0.1:8010/v1}
      STF_V3_LLM_MODEL: ${STF_V3_LLM_MODEL:-Qwen/Qwen3.6-27B-FP8}
      STF_V3_LLM_API_KEY: ${STF_V3_LLM_API_KEY:-none}
      STF_V3_LLM_PROFILE: ${STF_V3_LLM_PROFILE:-auto}
      STF_V3_LLM_ALLOW_CLOUD: ${STF_V3_LLM_ALLOW_CLOUD:-false}
      # Cloud comparison (PROD-09 D3): off by default; key falls back to
      # the manual-summary key STF_V3_OPENROUTER_API_KEY from infra/.env.
      STF_V3_CLOUD_LLM_ENABLED: ${STF_V3_CLOUD_LLM_ENABLED:-false}
      STF_V3_CLOUD_LLM_MODEL: ${STF_V3_CLOUD_LLM_MODEL:-deepseek/deepseek-v3.2}
      STF_V3_CLOUD_LLM_API_KEY: ${STF_V3_CLOUD_LLM_API_KEY:-}
      # Single level only: podman-compose 1.5 mis-reads a nested default
      # (${A:-${B:-}} → value + "}"), PROD-10 found the key corrupted.
      STF_V3_OPENROUTER_API_KEY: ${STF_V3_OPENROUTER_API_KEY:-}
      STF_V3_DEFAULT_LOCALE: ${STF_V3_DEFAULT_LOCALE:-zh-TW}
      STF_V3_MANUAL_IMAGES_ENABLED: ${STF_V3_MANUAL_IMAGES_ENABLED:-false}
      PYDANTIC_AI_NO_BANNER: "1"
    volumes:
      - obd_logs:/app/data/obd_logs   # PROD-05: raw uploads, <vehicle_id>/<log_id>.<ext>
      - manuals:/app/data/manuals     # PROD-06: public manual library (shared with host GPU worker)
    ports:
      - "${BIND_HOST:-127.0.0.1}:${STF_V3_API_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  stf-v3-worker:
    image: stf-v3:local
    container_name: stf-v3-worker
    command: ["procrastinate", "--app", "stf_v3.jobs.app.app", "worker",
              "-q", "default", "--concurrency", "2"]
    environment:
      STF_V3_DATABASE_URL: ${STF_V3_APP_DATABASE_URL:?set STF_V3_APP_DATABASE_URL}
      STF_V3_LOG_LEVEL: ${STF_V3_LOG_LEVEL:-INFO}
      STF_V3_OBD_LOG_STORAGE_PATH: /app/data/obd_logs
      STF_V3_MANUAL_STORAGE_PATH: /app/data/manuals
      # Agent runtime (PROD-08): the single model source.  Defaults to the
      # host's vLLM (docker-compose.vllm.yml, PROD-09); to fall back to
      # Ollama set URL/MODEL/API_KEY in infra/.env (profile auto-selects).
      # A non-local URL needs STF_V3_LLM_ALLOW_CLOUD=true (prompts then
      # carry a VIN pseudonym) and deploy_check.sh check 9 fails on it.
      STF_V3_LLM_BASE_URL: ${STF_V3_LLM_BASE_URL:-http://127.0.0.1:8010/v1}
      STF_V3_LLM_MODEL: ${STF_V3_LLM_MODEL:-Qwen/Qwen3.6-27B-FP8}
      STF_V3_LLM_API_KEY: ${STF_V3_LLM_API_KEY:-none}
      STF_V3_LLM_PROFILE: ${STF_V3_LLM_PROFILE:-auto}
      STF_V3_LLM_ALLOW_CLOUD: ${STF_V3_LLM_ALLOW_CLOUD:-false}
      # Cloud comparison (PROD-09 D3): off by default; key falls back to
      # the manual-summary key STF_V3_OPENROUTER_API_KEY from infra/.env.
      STF_V3_CLOUD_LLM_ENABLED: ${STF_V3_CLOUD_LLM_ENABLED:-false}
      STF_V3_CLOUD_LLM_MODEL: ${STF_V3_CLOUD_LLM_MODEL:-deepseek/deepseek-v3.2}
      STF_V3_CLOUD_LLM_API_KEY: ${STF_V3_CLOUD_LLM_API_KEY:-}
      # Single level only: podman-compose 1.5 mis-reads a nested default
      # (${A:-${B:-}} → value + "}"), PROD-10 found the key corrupted.
      STF_V3_OPENROUTER_API_KEY: ${STF_V3_OPENROUTER_API_KEY:-}
      STF_V3_DEFAULT_LOCALE: ${STF_V3_DEFAULT_LOCALE:-zh-TW}
      STF_V3_MANUAL_IMAGES_ENABLED: ${STF_V3_MANUAL_IMAGES_ENABLED:-false}
      PYDANTIC_AI_NO_BANNER: "1"
    volumes:
      - obd_logs:/app/data/obd_logs   # diagnosis jobs read raw logs here (PROD-08)
      - manuals:/app/data/manuals     # diagnosis jobs read manuals here (PROD-08)
    restart: unless-stopped

  stf-v3-migrate:
    image: stf-v3:local
    container_name: stf-v3-migrate
    environment:
      STF_V3_DATABASE_URL: ${STF_V3_DATABASE_URL:?set STF_V3_DATABASE_URL}
    command: ["alembic", "current"]
    profiles: ["migrate"]

# Named volume; with `-p stf_v3` podman-compose names it `stf_v3_obd_logs`.
# Distinct from V1's `diagnostic_api_obd_logs` (constraint B: never shared).
volumes:
  obd_logs:
  manuals:      # `stf_v3_manuals`; the host GPU worker writes into its _data dir
