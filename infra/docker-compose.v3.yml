# STF V3 services — independent Compose file (dev plan D3, constraint B).
# Shares ONLY infrastructure with V1/V2 (Postgres instance, vLLM, nginx),
# all via configuration.  Never merge this into docker-compose.yml.
#
# Build (GIT_COMMIT is baked into the image label for deploy_check.sh):
#   GIT_COMMIT=$(git rev-parse HEAD) podman-compose \
#     -f docker-compose.v3.yml -f docker-compose.v3.polyu.yml build
# Migrate (owner role):
#   podman-compose -f docker-compose.v3.yml -f docker-compose.v3.polyu.yml \
#     run --rm stf-v3-migrate alembic upgrade head
# Run (runtime role):
#   podman-compose -f docker-compose.v3.yml -f docker-compose.v3.polyu.yml \
#     up -d stf-v3-api stf-v3-worker
#
# Variables come from infra/.env on the server (never committed):
#   STF_V3_DATABASE_URL, STF_V3_APP_DATABASE_URL, STF_V3_JWT_SECRET

services:
  stf-v3-api:
    build:
      context: ../stf_v3
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: stf-v3:local
    container_name: stf-v3-api
    environment:
      STF_V3_DATABASE_URL: ${STF_V3_APP_DATABASE_URL:?set STF_V3_APP_DATABASE_URL}
      STF_V3_JWT_SECRET: ${STF_V3_JWT_SECRET:?set STF_V3_JWT_SECRET}
      STF_V3_ENVIRONMENT: ${STF_V3_ENVIRONMENT:-prod}
      STF_V3_LOG_LEVEL: ${STF_V3_LOG_LEVEL:-INFO}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${STF_V3_API_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  stf-v3-worker:
    image: stf-v3:local
    container_name: stf-v3-worker
    command: ["procrastinate", "--app", "stf_v3.jobs.app.app", "worker",
              "-q", "default", "--concurrency", "2"]
    environment:
      STF_V3_DATABASE_URL: ${STF_V3_APP_DATABASE_URL:?set STF_V3_APP_DATABASE_URL}
      STF_V3_LOG_LEVEL: ${STF_V3_LOG_LEVEL:-INFO}
    restart: unless-stopped

  stf-v3-migrate:
    image: stf-v3:local
    container_name: stf-v3-migrate
    environment:
      STF_V3_DATABASE_URL: ${STF_V3_DATABASE_URL:?set STF_V3_DATABASE_URL}
    command: ["alembic", "current"]
    profiles: ["migrate"]
