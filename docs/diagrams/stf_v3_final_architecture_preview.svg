<text x="60" y="-21.0" font-size="24" fill="#f8f9fa">STF V3 产品化架构 — Final（设计文档 v1.0 · 2026-09-01 定稿）</text>
<text x="170.0" y="24.55" text-anchor="middle" font-size="13" fill="#f1f3f5" font-weight="600">开源 / 第三方采用</text>
<text x="420.0" y="24.55" text-anchor="middle" font-size="13" fill="#f1f3f5" font-weight="600">沿用 V1/V2 资产</text>
<text x="660.0" y="24.55" text-anchor="middle" font-size="13" fill="#f1f3f5" font-weight="600">V3 新做</text>
<text x="900.0" y="24.55" text-anchor="middle" font-size="13" fill="#f1f3f5" font-weight="600">预留接口</text>
<text x="1170.0" y="24.55" text-anchor="middle" font-size="13" fill="#f1f3f5" font-weight="600">第二批 / 暂缓</text>
<text x="80" y="83.0" font-size="15" fill="#4dabf7">用户与前端（初版范围 = Stage 1 一键报告）</text>
<text x="200.0" y="134.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">用户</text>
<text x="200.0" y="149.2" text-anchor="middle" font-size="12" fill="#f1f3f5">车队管理者 / 维修技师</text>
<text x="200.0" y="164.2" text-anchor="middle" font-size="12" fill="#f1f3f5">手机 · 电脑浏览器</text>
<text x="530.0" y="134.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">obd-ui-v3 客户版 UI (新做)</text>
<text x="530.0" y="149.2" text-anchor="middle" font-size="12" fill="#f1f3f5">Next.js 15 + Tailwind v4</text>
<text x="530.0" y="164.2" text-anchor="middle" font-size="12" fill="#f1f3f5">shadcn/ui + TanStack Query</text>
<text x="885.0" y="134.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">移动优先 + PWA</text>
<text x="885.0" y="149.2" text-anchor="middle" font-size="12" fill="#f1f3f5">双视图:</text>
<text x="885.0" y="164.2" text-anchor="middle" font-size="12" fill="#f1f3f5">客户叙事 / 高级透视</text>
<text x="1200.0" y="134.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">边缘端 Jetson (沿用)</text>
<text x="1200.0" y="149.2" text-anchor="middle" font-size="12" fill="#f1f3f5">jetson_uploader</text>
<text x="1200.0" y="164.2" text-anchor="middle" font-size="12" fill="#f1f3f5">行程结束上传</text>
<text x="540" y="247.0" font-size="12" fill="#ced4da">REST + SSE</text>
<text x="900" y="242.0" font-size="12" fill="#ced4da">行程日志上传</text>
<text x="80" y="283.0" font-size="15" fill="#ffa94d">后端服务（FastAPI）</text>
<text x="230.0" y="354.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">Auth: 开源方案 (选型待定)</text>
<text x="230.0" y="369.2" text-anchor="middle" font-size="12" fill="#f1f3f5">邀请码注册核销 · JWT</text>
<text x="230.0" y="384.2" text-anchor="middle" font-size="12" fill="#f1f3f5">用户隔离</text>
<text x="560.0" y="354.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">上传薄层 (沿用逻辑)</text>
<text x="560.0" y="369.2" text-anchor="middle" font-size="12" fill="#f1f3f5">sha256 去重 · 只入库不诊断</text>
<text x="560.0" y="384.2" text-anchor="middle" font-size="12" fill="#f1f3f5">format ∈ {tsv, yamaha} 否则 422</text>
<text x="900.0" y="354.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">诊断编排薄层 (新做)</text>
<text x="900.0" y="369.2" text-anchor="middle" font-size="12" fill="#f1f3f5">SSE 事件适配</text>
<text x="900.0" y="384.2" text-anchor="middle" font-size="12" fill="#f1f3f5">审计 / 会话回写胶水</text>
<text x="1210.0" y="361.7" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">任务队列 (开源, 选型后议)</text>
<text x="1210.0" y="376.7" text-anchor="middle" font-size="12" fill="#f1f3f5">驱动 Manual 入库流水线</text>
<text x="430" y="457.0" font-size="12" fill="#ced4da">每次诊断请求</text>
<text x="80" y="483.0" font-size="15" fill="#b197fc">Agent 核心</text>
<text x="240.0" y="549.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">Agent Runtime: Pydantic AI</text>
<text x="240.0" y="564.2" text-anchor="middle" font-size="12" fill="#f1f3f5">loop / retry / 流式 / 压缩框架</text>
<text x="240.0" y="579.2" text-anchor="middle" font-size="12" fill="#f1f3f5">子代理 = agent-as-tool</text>
<text x="565.0" y="549.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">Context / Memory 策略 (新做)</text>
<text x="565.0" y="564.2" text-anchor="middle" font-size="12" fill="#f1f3f5">会话记忆 · 压缩触发</text>
<text x="565.0" y="579.2" text-anchor="middle" font-size="12" fill="#f1f3f5">车辆/用户历史注入</text>
<text x="890.0" y="549.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">工具组 (复制自 V2)</text>
<text x="890.0" y="564.2" text-anchor="middle" font-size="12" fill="#f1f3f5">OBD 原始读取 · 信号 · DTC</text>
<text x="890.0" y="579.2" text-anchor="middle" font-size="12" fill="#f1f3f5">Manual 导航 (manual_fs)</text>
<text x="1205.0" y="549.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">车队历史工具 (预留)</text>
<text x="1205.0" y="564.2" text-anchor="middle" font-size="12" fill="#f1f3f5">→ vehicle_data_twin</text>
<text x="1205.0" y="579.2" text-anchor="middle" font-size="12" fill="#f1f3f5">(学生项目 · 外部 · 只读)</text>
<text x="565.0" y="649.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">相似案例工具 (第二批)</text>
<text x="80" y="753.0" font-size="15" fill="#51cf66">数据层（独立新库 —— V3 专属）</text>
<text x="260.0" y="826.7" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">PostgreSQL + pgvector (新建库)</text>
<text x="260.0" y="841.7" text-anchor="middle" font-size="12" fill="#f1f3f5">users · invite_codes · vehicles · obd_logs</text>
<text x="260.0" y="856.7" text-anchor="middle" font-size="12" fill="#f1f3f5">conversations · messages · reports</text>
<text x="260.0" y="871.7" text-anchor="middle" font-size="12" fill="#f1f3f5">audit_events (append-only 黑匣子)</text>
<text x="595.0" y="834.2" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">manuals + rag_chunks</text>
<text x="595.0" y="849.2" text-anchor="middle" font-size="12" fill="#f1f3f5">V2 schema 复制 · 公共知识库</text>
<text x="595.0" y="864.2" text-anchor="middle" font-size="12" fill="#f1f3f5">Manual 入库流水线沿用</text>
<text x="885.0" y="841.7" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">文件存储</text>
<text x="885.0" y="856.7" text-anchor="middle" font-size="12" fill="#f1f3f5">原始日志 · Manual MD/图</text>
<text x="1190.0" y="826.7" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">预留不建</text>
<text x="1190.0" y="841.7" text-anchor="middle" font-size="12" fill="#f1f3f5">case_vectors (第二批)</text>
<text x="1190.0" y="856.7" text-anchor="middle" font-size="12" fill="#f1f3f5">fleets / 权限表</text>
<text x="1190.0" y="871.7" text-anchor="middle" font-size="12" fill="#f1f3f5">(需求出现再加, 迁移已评估)</text>
<text x="250" y="711.0" font-size="11" fill="#ced4da">会话/审计回写 + 业务读写</text>
<text x="895" y="711.0" font-size="11" fill="#ced4da">读原始字节 / Manual MD</text>
<text x="250.0" y="1011.7" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">本地 vLLM + Qwen3.6-27B</text>
<text x="250.0" y="1026.7" text-anchor="middle" font-size="12" fill="#f1f3f5">默认主力 (含嵌入)</text>
<text x="590.0" y="1011.7" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">云端接口 (保留)</text>
<text x="590.0" y="1026.7" text-anchor="middle" font-size="12" fill="#f1f3f5">仅供对比测试用</text>
<text x="960.0" y="1011.7" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">Golden 评测 Gate (沿用)</text>
<text x="960.0" y="1026.7" text-anchor="middle" font-size="12" fill="#f1f3f5">0.831 / 0.938 基线 · 一切改动的验收</text>
<text x="95" y="952.0" font-size="12" fill="#ced4da">LLM 调用（quirks 收敛在 Runtime 模型适配层）</text>
<text x="60" y="1103.0" font-size="13" fill="#adb5bd">交互四阶段 S1 一键报告 → S2 报告内追问 → S3 车辆级对话 → S4 主动触发（详见 v3_design_doc.md §2）。</text>
<text x="60" y="1119.25" font-size="13" fill="#adb5bd">V1/V2 并行运行直至废弃；clue YAML 规则暂存不进初版；VIN 暂存明文、择机模糊化；配额限流暂不做。</text>
