<text x="1190.0" y="841.70" text-anchor="middle" font-size="12" fill="#f1f3f5">case_vectors (第二批)</text>
<text x="1190.0" y="856.70" text-anchor="middle" font-size="12" fill="#f1f3f5">细粒度权限表 · vehicle_events (S4)</text>
