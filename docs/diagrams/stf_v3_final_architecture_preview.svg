<text x="250" y="710.73" font-size="11" fill="#ced4da">会话/审计回写 + 业务读写</text>
<text x="895" y="710.73" font-size="11" fill="#ced4da">读原始字节 / Manual MD</text>
<text x="250.0" y="1011.70" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">本地 vLLM + Qwen3.6-27B</text>
<text x="250.0" y="1026.70" text-anchor="middle" font-size="12" fill="#f1f3f5">唯一模型来源 · 按需拉起 · 空闲自停</text>
<text x="590.0" y="1011.70" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">云端接口 (保留)</text>
<text x="590.0" y="1026.70" text-anchor="middle" font-size="12" fill="#f1f3f5">仅供对比测试用</text>
<text x="960.0" y="1011.70" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">Golden 评测 Gate (沿用)</text>
<text x="960.0" y="1026.70" text-anchor="middle" font-size="12" fill="#f1f3f5">手册 0.878 · OBD 0.885 基线 · 受管改动必过</text>
<text x="95" y="951.70" font-size="12" fill="#ced4da">LLM 调用（quirks 收敛在 Runtime 模型适配层）</text>
<text x="60" y="1102.67" font-size="13" fill="#adb5bd">交互四阶段 S1 一键报告 → S2 报告内追问 → S3 车辆级对话 → S4 主动触发（详见 v3_design_doc.md §1.2）。</text>
<text x="60" y="1118.92" font-size="13" fill="#adb5bd">V1/V2 并行运行直至废弃；不做清单见设计文档 A3 / 开发计划 §4；每笔原始数据必须绑定车档（不允许 V-UNKNOWN）。</text>
