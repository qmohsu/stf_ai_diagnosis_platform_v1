<text x="200.0" y="164.20" text-anchor="middle" font-size="12" fill="#f1f3f5">手机 · 电脑浏览器</text>
<text x="530.0" y="134.20" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">obd-ui-v3 客户版 UI (归属待定)</text>
