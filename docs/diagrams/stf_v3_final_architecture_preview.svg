<text x="80" y="82.62" font-size="15" fill="#4dabf7" font-weight="600">用户与前端（初版范围 = Stage 1 一键报告）</text>
<text x="200.0" y="134.20" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">用户</text>
