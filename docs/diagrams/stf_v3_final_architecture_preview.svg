<text x="565.0" y="649.20" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">相似案例工具 (第二批)</text>
<text x="80" y="752.62" font-size="15" fill="#51cf66" font-weight="600">数据层（独立新库 —— V3 专属）</text>
<text x="260.0" y="811.70" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">PostgreSQL (新建库 stf_v3 · 无 pgvector)</text>
<text x="260.0" y="826.70" text-anchor="middle" font-size="12" fill="#f1f3f5">workshops · memberships · users · invite_codes</text>
<text x="260.0" y="841.70" text-anchor="middle" font-size="12" fill="#f1f3f5">vehicles (VIN=身份 · 车牌=标签) · vehicle_devices</text>
<text x="260.0" y="856.70" text-anchor="middle" font-size="12" fill="#f1f3f5">obd_logs · conversations · messages · reports</text>
<text x="260.0" y="871.70" text-anchor="middle" font-size="12" fill="#f1f3f5">audit_events · procrastinate 任务表</text>
<text x="260.0" y="886.70" text-anchor="middle" font-size="12" fill="#f1f3f5">model_service_state（按需模型状态 · PROD-11）</text>
<text x="595.0" y="834.20" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">manuals (元数据) + Markdown 文件</text>
