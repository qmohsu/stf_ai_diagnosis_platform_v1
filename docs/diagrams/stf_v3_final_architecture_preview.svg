<text x="1210.0" y="369.20" text-anchor="middle" font-size="12" fill="#f1f3f5">(Postgres 表 · 零新组件)</text>
<text x="1210.0" y="384.20" text-anchor="middle" font-size="12" fill="#f1f3f5">jobs: 手册入库 · 诊断 · 定时 · 启停 vLLM</text>
