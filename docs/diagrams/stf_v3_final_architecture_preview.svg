<text x="60" y="-21.60" font-size="24" fill="#f8f9fa">STF V3 产品化架构 — Final（设计文档 v1.15 · 2026-09-25 · 开发计划 v1.14 · PROD-11 诊断任务）</text>
<text x="170.0" y="24.55" text-anchor="middle" font-size="13" fill="#f1f3f5" font-weight="600">开源 / 第三方采用</text>
<text x="420.0" y="24.55" text-anchor="middle" font-size="13" fill="#f1f3f5" font-weight="600">沿用 V1/V2 资产</text>
<text x="660.0" y="24.55" text-anchor="middle" font-size="13" fill="#f1f3f5" font-weight="600">V3 新做</text>
<text x="900.0" y="24.55" text-anchor="middle" font-size="13" fill="#f1f3f5" font-weight="600">预留接口</text>
