<text x="595.0" y="864.20" text-anchor="middle" font-size="12" fill="#f1f3f5">手册转换走 jobs gpu 队列</text>
<text x="885.0" y="841.70" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">文件存储</text>
