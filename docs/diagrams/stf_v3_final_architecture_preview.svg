<text x="1200.0" y="164.20" text-anchor="middle" font-size="12" fill="#f1f3f5">每笔上传绑定唯一车档</text>
<text x="540" y="246.70" font-size="12" fill="#ced4da">REST + SSE</text>
<text x="900" y="241.70" font-size="12" fill="#ced4da">行程日志上传</text>
<text x="80" y="282.62" font-size="15" fill="#ffa94d" font-weight="600">后端服务（FastAPI）</text>
<text x="230.0" y="354.20" text-anchor="middle" font-size="12" fill="#f1f3f5" font-weight="600">Auth: fastapi-users</text>
